<div class="lf-searchbar-wrap" id="search-bar">
    <form id="searchForm" class="lf-search-form" action="{{ url_for('searchresults') }}" method="get"
          data-shorts-url="{{ url_for('shorts') }}" data-searchresults-url="{{ url_for('searchresults') }}">
        <div class="lf-search-inner">
            <span class="lf-search-prefix" aria-hidden="true">
                <img src="{{ url_for('static', filename='images/search.svg') }}" alt="" class="lf-search-prefix-icon">
            </span>
            <input
                class="lf-search-field notranslate"
                translate="no"
                id="query"
                type="search"
                name="query"
                value="{{ query if query else '' }}"
                placeholder="விரிவுரையில் ஒரு தலைப்பைத் தேடுங்கள்..."
                aria-label="Search within translated lecture transcripts"
                autocomplete="off"
                spellcheck="false">
            <button class="lf-mic-btn" id="micro-btn" type="button" title="Voice Search" aria-label="Voice Search">
                <img src="{{ url_for('static', filename='images/microphone.svg') }}" alt="Voice" class="lf-mic-icon">
            </button>
            <button class="lf-search-btn" type="submit" id="searchSubmitBtn">
                Search
                <span class="lf-search-btn-arrow" aria-hidden="true">→</span>
            </button>
        </div>
    </form>
</div>

{% include "popups.html" %}
